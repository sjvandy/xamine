name: XamineAgent
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Overridden by Xamine with the user's team so the bundle IDs are unique to that team.
    AGENT_BUNDLE_PREFIX: com.xamine.agent
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  XamineAgent:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AGENT_BUNDLE_PREFIX)
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Xamine Agent
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  XamineAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: XamineAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AGENT_BUNDLE_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: XamineAgent
schemes:
  XamineAgent:
    build:
      targets:
        XamineAgent: all
        XamineAgentUITests: [test]
    test:
      targets:
        - XamineAgentUITests
