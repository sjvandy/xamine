name: Xamine
options:
  bundleIdPrefix: com.sjvandy
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Xamine:
    type: application
    platform: macOS
    sources:
      - Xamine
      - Shared
      # The on-device agent's project, copied into the app and built for the user's device at runtime.
      - path: Agent
        type: folder
        buildPhase: resources
    dependencies:
      # The `xamine` CLI / MCP server, shipped at Xamine.app/Contents/Helpers/xamine.
      - target: xamine-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Xamine/Resources/Info.plist
      properties:
        CFBundleDisplayName: Xamine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    entitlements:
      path: Xamine/Resources/Xamine.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sjvandy.Xamine
        PRODUCT_NAME: Xamine
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 2R8MRUP265
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  xamine-cli:
    type: tool
    platform: macOS
    sources:
      - CLI
      - Shared
    settings:
      base:
        PRODUCT_NAME: xamine
        # Distinct from the app's `Xamine` module, which a case-insensitive file system would confuse it with.
        PRODUCT_MODULE_NAME: XamineCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.sjvandy.Xamine.cli
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 2R8MRUP265
        SKIP_INSTALL: true
  XamineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - XamineTests
    dependencies:
      - target: Xamine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sjvandy.XamineTests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 2R8MRUP265
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Xamine.app/Contents/MacOS/Xamine"
schemes:
  Xamine:
    build:
      targets:
        Xamine: all
        XamineTests: [test]
    test:
      targets:
        - XamineTests
